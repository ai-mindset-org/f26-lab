<!doctype html>
<!-- link preview 1200×630: render with tools/og.html → web/og.png (see README · устройство) -->
<html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#f28c1c; --ink:#141210; --muted:#857d70; --bg:#fcfaf6; --soft:#e2dccf}
*{box-sizing:border-box; margin:0}
body{width:1200px; height:630px; background:var(--bg); color:var(--ink); font-family:'JetBrains Mono',monospace; display:flex; padding:28px 28px 28px 56px; gap:28px; overflow:hidden}
.l{flex:1; display:flex; flex-direction:column}
.brand{display:flex; gap:18px; align-items:center; margin-top:22px}
.brand img{width:46px; height:auto}
.brand b{display:block; font-size:32px; font-weight:700; letter-spacing:.01em}
.brand span{display:block; font-size:15px; letter-spacing:.16em; color:var(--muted); margin-top:4px}
h1{font-size:66px; font-weight:800; letter-spacing:-.01em; margin-top:46px; white-space:nowrap}
h1 em{font-style:normal; background:var(--accent); padding:0 8px}
p{font-size:20px; line-height:1.5; margin-top:auto}
.wk{display:flex; margin-top:28px; border:1px solid var(--ink)} .wk b{flex:1; font-weight:500; font-size:15px; padding:9px 0; text-align:center; border-right:1px solid var(--ink)} .wk b:last-child{border-right:none} .wk b:first-child{background:var(--accent)}
.r{width:642px; border:1px solid var(--ink); overflow:hidden; position:relative; background:var(--bg)}
.r img{position:absolute; width:1180px; left:-70px; top:-370px}
.tag{position:absolute; right:10px; bottom:10px; background:var(--ink); color:var(--bg); font-size:13px; padding:4px 8px; letter-spacing:.06em}
</style></head><body>
<div class="l">
  <div class="brand"><img src="../web/assets/aim-logo.png" alt=""><div><b>AI Mindset</b><span>FALL ’26 LAB · F26</span></div></div>
  <h1><em>self</em>-harness</h1>
  <p>папка, в которой агент знает тебя: self.md в центре, онтология личного контекста и люди лабы вокруг</p>
  <div class="wk"><b>собрать</b><b>научить</b><b>отпустить</b><b>пользоваться</b></div>
</div>
<div class="r"><img src="../docs/graph-final.jpg" alt=""><span class="tag">12 фаз · 82 файла · 9 практик</span></div>
</body></html>
