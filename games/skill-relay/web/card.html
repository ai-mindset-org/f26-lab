<head>

<title>эстафета skills · карточка для LMS</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:'IBM Plex Mono';src:url('fonts/ibm-plex-mono-400.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'IBM Plex Mono';src:url('fonts/ibm-plex-mono-500.woff2') format('woff2');font-weight:500;font-style:normal;font-display:swap}
/* карточка под правую колонку LMS (208–288 px), размеры и цвета взяты у карточки компаса */
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:#4b5563;font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.card{display:block;border:1px solid #e5e7eb;border-radius:12px;background:#fff;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05);color:inherit;text-decoration:none;transition:border-color .2s,box-shadow .2s}
.card:hover{border-color:#d1d5db;box-shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06)}
.hd{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid #f3f4f6;font:500 12px/16px 'IBM Plex Mono','JetBrains Mono',Monaco,Consolas,monospace;color:#374151}
.hd svg{flex:none;width:12px;height:12px;stroke:#dc2626;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hd em{margin-left:auto;font-style:normal;font-weight:400;font-size:10px;color:#9ca3af}
.hd em.run{color:#dc2626}
#pic{display:block;width:100%}
.tx{padding:0 12px 8px;font-size:12px;line-height:1.375;margin:0}
.ft{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;border-top:1px solid #f3f4f6;font:10px/15px 'IBM Plex Mono','JetBrains Mono',Monaco,Consolas,monospace}
.ft span{color:#9ca3af;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ft b{font-weight:400;color:#dc2626;white-space:nowrap}
@keyframes p{50%{opacity:.35}}
.run{animation:p 1.4s ease-in-out infinite}
</style>
</head>
<body>
<a class="card" id="go" href="lms/" target="_top" aria-label="эстафета skills: взять skill и внести одно изменение">
  <div class="hd"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>эстафета skills<em id="tag"></em></div>
  <svg id="pic" viewBox="0 0 200 100" aria-hidden="true"></svg>
  <p class="tx">возьми skill и выбери одно правило: модель внесёт правку, ты проверишь и передашь следующему. на всё пять минут</p>
  <div class="ft"><span id="st"></span><b>взять skill →</b></div>
</a>
<script src="card.js" defer></script>
</body>
