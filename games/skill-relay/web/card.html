<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>эстафета skills · карточка для LMS</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:'JetBrains Mono';src:url('fonts/jetbrains-mono.woff2') format('woff2');font-weight:100 800;font-style:normal;font-display:swap}
:root{--bg:transparent;--card:#ffffff;--ink:#141414;--ink2:rgba(20,20,20,.6);--ink3:rgba(20,20,20,.28);--line:rgba(20,20,20,.12);--acc:#D92027}
:root[data-theme=dark]{--card:#1b1a19;--ink:#ecebe6;--ink2:rgba(236,235,230,.62);--ink3:rgba(236,235,230,.28);--line:rgba(236,235,230,.14)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;-webkit-font-smoothing:antialiased}
body{padding:12px}
.card{max-width:440px;border:1px solid var(--line);border-radius:20px;background:var(--card);overflow:hidden}
.hd{display:flex;gap:12px;align-items:center;padding:16px 18px 12px}
.ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--acc);display:grid;place-items:center}
.ic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hd b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em}
.hd span{font-size:11px;color:var(--ink2)}
.hd .tag{margin-left:auto;font-size:10.5px;color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:3px 9px;white-space:nowrap}
.bd{padding:0 18px 14px;font-size:12.5px;line-height:1.55;color:var(--ink2)}
.bd p{margin:0 0 12px}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line)}
.ln b{font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln em{font-style:normal;font-size:11px;color:var(--ink2);white-space:nowrap}
.ln em.run{color:var(--acc)}
.tr{grid-column:1/3;display:flex;align-items:center;gap:0;height:12px}
.tr i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.tr i.ball{width:11px;height:11px;background:var(--ink)}
.tr i.ball.run{background:var(--acc);animation:p 1.4s ease-in-out infinite}
.tr u{flex:1;max-width:26px;height:1px;background:var(--ink3)}
.tr u.end{max-width:none;background:none;border-top:1px dashed var(--line)}
@keyframes p{50%{opacity:.35}}
.st{display:flex;gap:14px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line);font-size:11px}
.st b{color:var(--ink);font-weight:600}
.ft{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px 14px;border-top:1px solid var(--line);font-size:12.5px}
.ft a{color:var(--acc);text-decoration:none;font-weight:600}
.ft a:hover{text-decoration:underline}
.ft span{font-size:10.5px;color:var(--ink3)}
</style>
</head>
<body>
<div class="card">
  <div class="hd"><div class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="6"/><path d="M8 12h5"/><circle cx="16" cy="12" r="1.6"/></svg></div>
    <div><b>эстафета skills</b><span>игра лабы F26</span></div><span class="tag" id="tag">стол</span></div>
  <div class="bd">
    <p>Skill растёт по одному изменению. Возьми skill со стола, примени одно правило и отдай новой версией следующему.</p>
    <div id="lanes"></div>
    <div class="st" id="st"></div>
  </div>
  <div class="ft"><a id="go" href="./?skin=lms" target="_blank" rel="noopener">взять skill →</a><span id="upd"></span></div>
</div>
<script src="card.js" defer></script>
</body>
</html>
