<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>эстафета skills · AI Mindset</title>
<meta name="description" content="Открытая эстафета skills: пять skills на дорожках, участник берёт один, добавляет одно изменение и коммитит за пять минут. В дорожке лежит новая версия, у каждой версии видно, кто её внёс и через какого агента.">
<meta name="robots" content="noindex">
<style>
@font-face{font-family:'JetBrains Mono';src:url('fonts/jetbrains-mono.woff2') format('woff2');font-weight:100 800;font-style:normal;font-display:swap}
:root{--bg:#ffffff;--ink:#111111;--ink2:rgba(17,17,17,.56);--ink3:rgba(17,17,17,.24);--line:rgba(17,17,17,.14);--grid:rgba(17,17,17,.075);--acc:#FF8C00}
:root[data-theme=dark]{--bg:#0d0d0c;--ink:#ecebe6;--ink2:rgba(236,235,230,.58);--ink3:rgba(236,235,230,.24);--line:rgba(236,235,230,.14);--grid:rgba(236,235,230,.06)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;-webkit-font-smoothing:antialiased}
body{background-image:radial-gradient(var(--grid) 1px,transparent 1.2px);background-size:24px 24px;transition:background-color .8s}
body.field-on{background-image:none}
body>.field{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.frame{position:fixed;inset:18px;pointer-events:none;z-index:3}
.frame i{position:absolute;width:18px;height:18px;border-color:var(--ink3);border-style:solid;border-width:0}
.frame .tl{left:0;top:0;border-left-width:1px;border-top-width:1px}
.frame .tr{right:0;top:0;border-right-width:1px;border-top-width:1px}
.frame .bl{left:0;bottom:0;border-left-width:1px;border-bottom-width:1px}
.frame .br{right:0;bottom:0;border-right-width:1px;border-bottom-width:1px}
.top{position:fixed;left:44px;right:44px;top:34px;display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-size:12px;letter-spacing:.02em;color:var(--ink2);z-index:3}
.top b{font-weight:500;color:var(--ink)}
.top .ph{color:var(--acc)}
.top .brand i{font-style:normal}
.stage{position:fixed;left:44px;top:70px;bottom:78px;width:calc(46vw - 44px)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.panel{position:fixed;left:50vw;right:44px;top:70px;bottom:78px;overflow:auto;padding:6px 14px 24px 0;scrollbar-width:thin}
.rail{position:fixed;left:44px;right:44px;bottom:38px;display:flex;gap:4px;pointer-events:none;z-index:3}
.rail .seg{position:relative;height:2px;background:var(--line);flex:1 1 0}
.rail .seg.past{background:var(--ink3)}
.rail .seg.now{background:var(--acc)}
.rail .seg span{position:absolute;left:0;bottom:8px;font-size:10.5px;color:var(--ink3);white-space:nowrap;letter-spacing:.02em}
.rail .seg.past span{color:var(--ink2)}
.rail .seg.now span{color:var(--acc)}
.toast{position:fixed;right:44px;top:56px;font-size:12px;color:var(--acc);opacity:0;transition:opacity .3s;pointer-events:none;z-index:4;background:var(--bg);padding:2px 0 2px 8px}
.toast.on{opacity:1}

.kick{font-size:12px;color:var(--ink2);letter-spacing:.02em}
h1{font-size:clamp(40px,6vw,84px);line-height:.98;margin:18px 0 18px;font-weight:600;letter-spacing:-.035em}
h1 em{font-style:normal;color:var(--acc)}
.path{font-size:clamp(13px,1.3vw,16px);line-height:1.6;color:var(--ink)}
.path span{color:var(--ink3)}
.why{font-size:13px;line-height:1.6;color:var(--ink2);margin:16px 0 22px;max-width:620px}
.m{font-size:clamp(20px,2.05vw,30px);line-height:1.22;font-weight:500;letter-spacing:-.01em;margin:10px 0 0}
.m em{font-style:normal;color:var(--acc);white-space:nowrap;font-variant-numeric:tabular-nums}
.s{margin:10px 0 0;font-size:13px;line-height:1.55;color:var(--ink2);max-width:620px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
button,a.btn{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--ink3);padding:10px 14px;cursor:pointer;border-radius:0;text-decoration:none;display:inline-block}
button:hover,a.btn:hover{border-color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:1px solid var(--ink);outline-offset:1px}
button.sel{border-color:var(--acc);color:var(--acc)}
button.go,a.btn.go{background:var(--ink);color:var(--bg);border-color:var(--ink);padding:12px 22px}
button.go:hover,a.btn.go:hover{background:var(--acc);border-color:var(--acc)}
button.quiet{border:0;border-bottom:1px solid var(--line);padding:2px 0;font-size:11.5px;color:var(--ink2)}
button.quiet:hover{color:var(--ink);border-color:var(--ink)}
a.quiet{color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--line);padding:2px 0;font-size:11.5px}
a.quiet:hover{color:var(--ink);border-color:var(--ink)}
button[disabled]{opacity:.4;cursor:default}
.blk{margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.lab{font-size:11px;color:var(--ink2);letter-spacing:.02em;margin:0 0 8px}
.lab b{font-weight:500;color:var(--ink)}
.fld{margin-top:12px}
.fld label{display:block;font-size:11px;color:var(--ink2);margin-bottom:5px}
input[type=text],textarea,select{font:inherit;font-size:12.5px;line-height:1.5;color:var(--ink);background:var(--bg);border:1px solid var(--ink3);border-radius:0;padding:9px 10px;width:100%}
textarea{resize:vertical;min-height:44px}
textarea.code{min-height:340px;white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto;tab-size:2}
pre{font:inherit;font-size:12px;line-height:1.55;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
pre.skill{border:1px solid var(--line);background:var(--bg);padding:12px 14px;max-height:320px;overflow:auto}
.note{font-size:12.5px;line-height:1.55;margin:6px 0 0}
.note i{font-style:normal;color:var(--ink2)}
.facts{list-style:none;margin:8px 0 0;padding:0;font-size:12px;line-height:1.6}
.facts li{display:grid;grid-template-columns:52px 1fr;gap:8px;color:var(--ink2)}
.facts li.stop{color:var(--ink)}
.facts li b{font-weight:600}
.diff{border-left:2px solid var(--ink3);padding:4px 0 4px 12px;margin-top:8px;font-size:12px;line-height:1.55}
.diff div{white-space:pre-wrap;overflow-wrap:anywhere}
.diff .del{color:var(--ink3);text-decoration:line-through}
.diff .add{color:var(--ink);font-weight:500}
.msg{margin-top:12px;font-size:12px;line-height:1.55;color:var(--ink);border:1px solid var(--ink);padding:10px 12px;white-space:pre-wrap;background:var(--bg)}
.msg.ok{border-color:var(--line);color:var(--ink2)}
.lanes{margin-top:22px;border-top:1px solid var(--line)}
.ln{display:grid;grid-template-columns:26px 1fr auto auto;gap:4px 12px;align-items:center;border-bottom:1px solid var(--line);padding:11px 0;font-size:12.5px}
.ln .no{color:var(--ink3);font-variant-numeric:tabular-nums}
.ln.mine .no{color:var(--acc)}
.ln .nm{border:0;padding:0;text-align:left;font-size:13px;font-weight:500}
.ln .nm:hover{color:var(--acc)}
.ln .meta{grid-column:2;color:var(--ink2);font-size:11.5px;line-height:1.5}
.ln .laps{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;grid-row:1 / 3;grid-column:3}
.ln .laps i{font-style:normal;font-weight:400;font-size:10.5px;color:var(--ink2);display:block;text-align:right}
.ln .act{grid-row:1 / 3;grid-column:4;min-width:96px;text-align:right;font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.ln .act button{padding:8px 14px;font-size:12.5px}
.cand{display:block;width:100%;text-align:left;margin-top:8px;padding:10px 12px;line-height:1.5;font-size:12.5px}
.cand b{font-weight:600}
.cand span{display:block;color:var(--ink2);font-size:12px;margin-top:2px}
.cand.sel span{color:var(--ink)}
.rule{margin-top:18px;padding-left:14px;border-left:1px solid var(--line);font-size:12.5px;line-height:1.55}
.rule h3{font-size:13px;font-weight:600;margin:0 0 6px}
.rule h3 span{color:var(--ink2);font-weight:400}
.rule p{margin:4px 0 0;color:var(--ink2)}
.rule p b{font-weight:500;color:var(--ink)}
.rule a,.src a{color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--line);font-size:11.5px}
.rule a:hover,.src a:hover{color:var(--acc);border-color:var(--acc)}
.src{font-size:12px;line-height:1.9;color:var(--ink2);margin-top:10px}
.rv{margin-top:14px;border:1px solid var(--ink);padding:12px 14px;font-size:12.5px;line-height:1.55;background:var(--bg)}
.rv.soft{border-color:var(--line)}
.rv h4{margin:0 0 6px;font-size:13px;font-weight:600}
.rv h4 span{font-weight:400;color:var(--ink2);font-size:11.5px}
.rv .flags{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--ink2);margin-bottom:6px}
.rv .flags b{font-weight:600;color:var(--ink)}
.leg{margin-top:16px;padding-left:14px;border-left:1px solid var(--line)}
.leg h3{font-size:12.5px;font-weight:500;margin:0 0 6px}
.leg h3 span{color:var(--ink2);font-weight:400}
.trail{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;line-height:1.75;color:var(--ink2)}
.trail b{font-weight:500;color:var(--ink)}
.trail .sys,.trail .sys b{color:var(--ink3);font-weight:400}
.trail>.sys:first-of-type{color:var(--ink2)}
.trail u{text-decoration:none;color:var(--acc)}
.trail button.quiet{margin-top:6px}
details{margin-top:8px;font-size:12px}
details summary{cursor:pointer;color:var(--ink2);list-style:none}
details summary::before{content:'+ '}
details[open] summary::before{content:'– '}
details pre{margin-top:6px;color:var(--ink2)}
.keys{margin-top:24px;font-size:11.5px;line-height:1.9;color:var(--ink2)}
.keys kbd{font:inherit;color:var(--ink);border:1px solid var(--line);padding:0 5px;margin-right:4px}
.more{margin-top:18px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:11.5px}
.cnt{font-size:11.5px;color:var(--ink2);margin-top:6px;font-variant-numeric:tabular-nums}
.cnt b{font-weight:600;color:var(--ink)}
.cnt b.over{color:var(--acc)}
@media (max-width:900px){
  .top{left:30px;right:30px;top:28px;font-size:11px;position:absolute}
  .top .brand i{display:none}
  .top #where{display:none}
  .stage{position:relative;left:auto;top:auto;bottom:auto;width:auto;height:270px;margin:58px 20px 0}
  .rail{position:relative;left:auto;right:auto;bottom:auto;margin:30px 20px 22px}
  .panel{position:relative;left:auto;right:auto;top:auto;bottom:auto;overflow:visible;padding:4px 20px 56px}
  .rail .seg span{display:none}
  .rail .seg.now span{display:block}
  .toast{right:30px;top:48px}
  h1{margin:14px 0}
  .ln{grid-template-columns:22px 1fr auto}
  .ln .act{grid-column:2 / 4;grid-row:3;text-align:left;min-width:0}
}
.ln{grid-template-columns:26px minmax(0,1fr) auto;gap:4px 14px;align-items:start;padding:15px 0}
.ln .bd{min-width:0}
.ln .what{margin:4px 0 9px;font-size:11.5px;line-height:1.5;color:var(--ink2);max-width:560px}
.ln .meta{display:block;grid-column:auto;margin-top:8px;color:var(--ink3);font-size:11px}
.ln .side{text-align:right;min-width:104px}
.ln .ver{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.ln.mine .ver{color:var(--acc)}
.ln .ver i{display:block;font-style:normal;font-weight:400;font-size:10.5px;color:var(--ink2);margin:4px 0 9px}
.ln .act{display:block;grid-row:auto;grid-column:auto;min-width:0}
.task{margin-top:14px;border:1px solid var(--ink);padding:12px 14px 13px;font-size:12.5px;line-height:1.55;background:var(--bg);max-width:680px}
.task .lab{margin:0 0 4px}
.task p{margin:4px 0 0;color:var(--ink2)}
.task p b{font-weight:600;color:var(--ink)}
.rule.pic{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 16px;align-items:start}
.cand span.kind{display:inline-flex;margin:0 2px 0 0;font-size:11px;color:var(--ink);vertical-align:-3px}
.cand>span{display:block}
.leg h3 .kind{margin:0 4px;vertical-align:-4px}
.leg details{margin-top:4px}
.trail .ev{display:grid;grid-template-columns:40px 74px minmax(0,1fr);gap:8px;padding:3px 0;line-height:1.5}
.trail .ev .tm{color:var(--ink3);font-variant-numeric:tabular-nums}
.trail .ev b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trail .ev .kind{font-size:11px;vertical-align:-4px;padding:2px 6px 2px 4px}
.trail .lab{margin-bottom:6px}
@media (max-width:900px){
  .ln{grid-template-columns:22px minmax(0,1fr) auto}
  .ln .side{min-width:70px}
  .ln .act{grid-column:auto;grid-row:auto;text-align:right}
  .rule.pic{grid-template-columns:72px minmax(0,1fr);gap:4px 12px}
  .rule.pic .fig svg{width:72px;height:48px}
  .trail .ev{grid-template-columns:38px 62px minmax(0,1fr)}
}
</style>
<link rel="stylesheet" href="art.css">
<style>.top .brand{color:inherit;text-decoration:none}
@media (max-width:900px){.stage{margin-top:92px}}</style>
</head>
<body data-field>
<div class="frame"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
<div class="top"><a class="brand" href="./" title="на стол"><b>AI Mindset</b><i> · f26</i> · эстафета skills</a><nav class="tabs"><a href="./" class="on">стол</a><a href="show">как это работает</a><a href="try">попробовать</a><a href="rules">правила</a><a href="./?view=log">журнал</a></nav><span><span class="ph" id="ph"></span> <span id="where"></span></span></div>
<div class="stage" id="stage"><canvas id="cv" aria-label="стадион: skills идут по дорожкам, оранжевый у тебя"></canvas></div>
<div class="rail" id="rail"></div>
<main class="panel" id="panel"></main>
<div class="toast" id="toast" role="status"></div>
<script src="field.js" defer></script>
<script src="art.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
